<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>I Ching – Claude</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        :root {
            --ink: #212529;
            --change: #dc3545;
            --empty: #ced4da;
            --bar-w: min(220px, 42vw);
        }
        body { background: #f8f9fa; }

        /* ---------- board: 6 line rows, line 6 at the top ---------- */
        .board { max-width: 560px; margin: 0 auto; }
        .hx-row {
            display: flex; align-items: center; gap: 14px;
            padding: 8px 0;
        }
        .hx-pos { width: 18px; text-align: right; color: #6c757d; font-size: .85rem; }
        .hx-bar {
            --c: var(--ink);
            width: var(--bar-w); height: 20px; flex: none;
            border-radius: 3px;
            transition: background .4s, transform .4s;
        }
        .hx-bar.empty { border: 2px dashed var(--empty); }
        .hx-bar.yang  { background: var(--c); }
        .hx-bar.yin   { background: linear-gradient(to right, var(--c) 0 43%, transparent 43% 57%, var(--c) 57%); }
        .hx-bar.changing { --c: var(--change); }
        .hx-bar.drawn { animation: draw .45s ease-out; }
        @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }

        .hx-throw { display: flex; flex-direction: column; gap: 2px; min-width: 120px; }
        .hx-coins { display: flex; gap: 6px; }
        .hx-label { font-size: .8rem; color: #6c757d; min-height: 1.2em; }

        /* ---------- coins ---------- */
        .coin {
            width: 32px; height: 32px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: .85rem;
        }
        .coin.blank { border: 2px dashed var(--empty); }
        .coin.heads {
            background: radial-gradient(circle at 35% 30%, #ffe08a, #d4a017 70%);
            color: #5c4300; box-shadow: inset 0 0 0 2px #b8860b;
        }
        .coin.tails {
            background: radial-gradient(circle at 35% 30%, #e9ecef, #8d969e 70%);
            color: #343a40; box-shadow: inset 0 0 0 2px #6c757d;
        }
        .coin.flip { animation: flip .55s ease-out both; }
        @keyframes flip {
            0%   { transform: rotateY(0) translateY(0); opacity: .2; }
            50%  { transform: rotateY(540deg) translateY(-10px); }
            100% { transform: rotateY(720deg) translateY(0); opacity: 1; }
        }

        /* ---------- result ---------- */
        .mini { display: flex; flex-direction: column; gap: 5px; }
        .mini .hx-bar { width: 72px; height: 9px; border-radius: 2px; }
        .hx-glyph { font-size: 3.5rem; line-height: 1; }
        .legend-swatch { display: inline-block; width: 22px; height: 8px; vertical-align: middle; border-radius: 2px; }
    </style>
</head>

<body class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">I Ching – Three Coin Method</h1>
        <a href="/" class="btn btn-outline-secondary btn-sm">Home</a>
    </div>
    <p class="text-muted">
        Hold your question in mind and throw the three coins six times.
        Heads = 3, tails = 2. Lines build from the bottom up.
    </p>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="board" id="board">
                {% for pos in range(6, 0, -1) %}
                <div class="hx-row" id="row-{{ pos }}">
                    <div class="hx-pos">{{ pos }}</div>
                    <div class="hx-bar empty"></div>
                    <div class="hx-throw">
                        <div class="hx-coins">
                            <span class="coin blank"></span><span class="coin blank"></span><span class="coin blank"></span>
                        </div>
                        <div class="hx-label"></div>
                    </div>
                </div>
                {% endfor %}
            </div>

            <div class="text-center mt-3">
                <button id="throw-btn" class="btn btn-primary btn-lg">Throw coins (1 of 6)</button>
                <button id="again-btn" class="btn btn-outline-primary btn-lg d-none">Throw again</button>
            </div>
            <p id="legend" class="small text-muted text-center mt-3 mb-0 d-none">
                <span class="legend-swatch" style="background:var(--change)"></span>
                changing line (old yin 6 / old yang 9)
            </p>
        </div>
    </div>

    <div id="result" class="d-none">
        <div class="row g-3 mb-3" id="cards"></div>
        <div id="changes" class="mb-3"></div>
        <button id="speak-btn" class="btn btn-outline-secondary">🔊 Read aloud</button>
    </div>

    <script>
        const THROW_URL = "{{ url_for('iching.claude_iching_throw') }}";
        const READING_URL = "{{ url_for('iching.claude_iching_reading') }}";

        const throwBtn = document.getElementById("throw-btn");
        const againBtn = document.getElementById("again-btn");
        const speakBtn = document.getElementById("speak-btn");
        const throws = [];   // index 0 = line 1 (bottom)
        let reading = null;

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function getJson(url) {
            const res = await fetch(url, { cache: "no-store" });
            if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
            return res.json();
        }

        throwBtn.addEventListener("click", async () => {
            throwBtn.disabled = true;
            try {
                const t = await getJson(THROW_URL);
                throws.push(t);
                const row = document.getElementById(`row-${throws.length}`);
                row.querySelector(".hx-coins").innerHTML = t.coins.map((c, i) =>
                    `<span class="coin flip ${c === "H" ? "heads" : "tails"}"
                           style="animation-delay:${i * 90}ms"
                           title="${c === "H" ? "Heads (3)" : "Tails (2)"}">${c}</span>`).join("");
                row.querySelector(".hx-label").textContent = `${t.total} · ${t.label}`;
                row.querySelector(".hx-bar").className =
                    barClass(t.line.endsWith("yang"), t.line.startsWith("old-")) + " drawn";
                if (t.line.startsWith("old-")) document.getElementById("legend").classList.remove("d-none");
            } catch (err) {
                alert("Could not throw the coins: " + err.message);
                throwBtn.disabled = false;
                return;
            }

            if (throws.length < 6) {
                throwBtn.textContent = `Throw coins (${throws.length + 1} of 6)`;
                throwBtn.disabled = false;
                return;
            }
            throwBtn.classList.add("d-none");
            await reveal();
        });

        async function reveal() {
            const qs = throws.map((t, i) => `line${i + 1}=${t.line}`).join("&");
            reading = await getJson(`${READING_URL}?${qs}`);

            await sleep(500);
            renderResult(reading);
            againBtn.classList.remove("d-none");
        }

        function barClass(bit, changing) {
            return "hx-bar " + (bit ? "yang" : "yin") + (changing ? " changing" : "");
        }

        // small hexagram drawing, top line first
        function miniLines(bits, changing) {
            let html = "";
            for (let i = 5; i >= 0; i--) {
                html += `<div class="${barClass(bits[i], changing.includes(i + 1))}"></div>`;
            }
            return html;
        }

        function hexCard(h, title, changing) {
            return `
            <div class="col-md-6">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <div class="text-uppercase small text-muted">${title}</div>
                        <div class="d-flex align-items-center gap-4 my-3">
                            <div class="mini">${miniLines(h.binary, changing)}</div>
                            <div class="hx-glyph" aria-hidden="true">${h.symbol}</div>
                        </div>
                        <h4 class="mb-1">${h.number}. ${h.name}</h4>
                        <div class="small text-muted mb-2">
                            ${h.upper.symbol} ${h.upper.image} (${h.upper.name}) over
                            ${h.lower.symbol} ${h.lower.image} (${h.lower.name})
                        </div>
                        <p class="mb-0">${h.desc}</p>
                    </div>
                </div>
            </div>`;
        }

        function renderResult(r) {
            let cards = hexCard(r.primary, "Your hexagram", r.changing_lines);
            let changes;
            if (r.relating) {
                cards += hexCard(r.relating, "Changing to", []);
                changes = "<h5>Changing lines</h5><ul class='mb-0'>" + r.changing_lines.map(n => {
                    const t = throws[n - 1];
                    const to = t.line === "old-yin" ? "⚊ yang" : "⚋ yin";
                    return `<li>Line ${n}: ${t.label} → ${to}</li>`;
                }).join("") + "</ul>";
            } else {
                changes = "<p class='mb-0'>No changing lines — the situation is stable; read this hexagram on its own.</p>";
            }
            document.getElementById("cards").innerHTML = cards;
            document.getElementById("changes").innerHTML = changes;
            document.getElementById("result").classList.remove("d-none");
            document.getElementById("result").scrollIntoView({ behavior: "smooth", block: "start" });
        }

        // ---------- read the reading aloud ----------
        if (!("speechSynthesis" in window)) speakBtn.classList.add("d-none");
        speakBtn.addEventListener("click", () => {
            const p = reading.primary;
            let text = `Hexagram ${p.number}, ${p.name}. ${p.upper.image} over ${p.lower.image}. ${p.desc}`;
            if (reading.relating) {
                const r = reading.relating;
                text += ` Changing lines: ${reading.changing_lines.join(", ")}.`
                      + ` Changing to hexagram ${r.number}, ${r.name}. ${r.desc}`;
            } else {
                text += " There are no changing lines.";
            }
            speechSynthesis.cancel();
            speechSynthesis.speak(new SpeechSynthesisUtterance(text));
        });

        againBtn.addEventListener("click", () => location.reload());
    </script>
</body>
</html>
